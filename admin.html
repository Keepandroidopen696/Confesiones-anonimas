
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrativo | LYNX</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080b12;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 800px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    color: #55aaff;
}

.panel {
    background: #111827;
    border: 1px solid #263449;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 {
    color: #65b5ff;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #34445e;
    background: #080d17;
    color: white;
    margin: 10px 0;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    width: 100%;
    background: #1685e8;
}

.approve {
    background: #168b58;
    margin-right: 8px;
}

.reject {
    background: #bd3545;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.confession {
    background: #0b1220;
    border: 1px solid #263449;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.date {
    color: #71829a;
    font-size: 12px;
    margin-top: 10px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.actions button {
    flex: 1;
}

#status {
    margin-top: 12px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    color: #637086;
    font-size: 12px;
    padding: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>LYNX NETWORK</h1>
    <p>Panel de administración de confesiones</p>
</header>

<section class="panel" id="loginPanel">
    <h2>Acceso administrativo</h2>

    <input
        type="password"
        id="adminKey"
        placeholder="Introduce tu Admin Key"
        autocomplete="current-password"
    >

    <button class="primary" onclick="login()">
        Iniciar sesión
    </button>

    <div id="loginStatus" role="status"></div>
</section>

<section class="panel hidden" id="dashboard">
    <h2>Confesiones pendientes</h2>

    <button class="primary" onclick="loadPending()">
        Actualizar lista
    </button>

    <button
        onclick="logout()"
        style="width:100%; margin-top:10px; background:#34445e;"
    >
        Cerrar sesión
    </button>

    <div id="status" role="status"></div>
    <div id="pending"></div>
</section>

<footer>
    LYNX NETWORK © 2026<br>
    Sistema de moderación
</footer>

</div>

<script>
const API = "https://confesiones.lynxnetwork.workers.dev";

let adminKey = "";

async function login() {
    const input = document.getElementById("adminKey");
    const status = document.getElementById("loginStatus");

    const key = input.value;

    if (!key) {
        status.textContent = "Introduce tu Admin Key.";
        return;
    }

    status.textContent = "Verificando acceso...";

    try {
        const response = await fetch(API + "/api/admin/confessions", {
            headers: {
                "Authorization": "Bearer " + key
            }
        });

        if (response.status === 401) {
            status.textContent = "Admin Key incorrecta.";
            return;
        }

        if (!response.ok) {
            throw new Error("Error de conexión");
        }

        adminKey = key;

        document.getElementById("loginPanel").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");

        input.value = "";
        await renderPending(await response.json());

    } catch (error) {
        status.textContent = "No se pudo conectar con el servidor.";
    }
}

async function loadPending() {
    const status = document.getElementById("status");

    status.textContent = "Cargando...";
    
    try {
        const response = await fetch(API + "/api/admin/confessions", {
            headers: {
                "Authorization": "Bearer " + adminKey
            }
        });

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error("Error de servidor");
        }

        await renderPending(await response.json());
        status.textContent = "";

    } catch (error) {
        status.textContent = "No se pudo cargar la lista.";
    }
}

async function renderPending(data) {
    const container = document.getElementById("pending");
    container.replaceChildren();

    if (!Array.isArray(data) || data.length === 0) {
        container.textContent = "No hay confesiones pendientes.";
        return;
    }

    data.forEach(item => {
        const card = document.createElement("div");
        card.className = "confession";

        const message = document.createElement("div");
        message.textContent = item.message;

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = item.created_at || "";

        const actions = document.createElement("div");
        actions.className = "actions";

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "Aprobar";
        approve.onclick = () => moderate(item.id, "aprobada", card);

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Rechazar";
        reject.onclick = () => moderate(item.id, "rechazada", card);

        actions.append(approve, reject);
        card.append(message, date, actions);
        container.appendChild(card);
    });
}

async function moderate(id, decision, card) {
    const status = document.getElementById("status");
    const buttons = card.querySelectorAll("button");

    if (decision === "rechazada" &&
        !confirm("¿Seguro que quieres rechazar esta confesión?")) {
        return;
    }

    buttons.forEach(button => button.disabled = true);
    status.textContent = "Guardando decisión...";

    try {
        const response = await fetch(
            API + "/api/admin/confessions/" + id,
            {
                method: "PATCH",
                headers: {
                    "Authorization": "Bearer " + adminKey,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status: decision })
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error("No se pudo guardar");
        }

        status.textContent = "Decisión guardada correctamente.";
        await loadPending();

    } catch (error) {
        status.textContent = "Error al guardar. Intenta de nuevo.";
        buttons.forEach(button => button.disabled = false);
    }
}

function logout() {
    adminKey = "";

    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginPanel").classList.remove("hidden");
    document.getElementById("adminKey").value = "";
    document.getElementById("loginStatus").textContent = "";
    document.getElementById("pending").replaceChildren();
    document.getElementById("status").textContent = "";
}
</script>
</body>
</html>
