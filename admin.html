<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYNX | Panel Administrativo</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #080b12;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 800px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 { color: #55aaff; }

.panel {
    background: #111827;
    border: 1px solid #263449;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 { color: #65b5ff; }

input, textarea {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #34445e;
    background: #080d17;
    color: white;
    margin: 10px 0;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.primary {
    width: 100%;
    background: #1685e8;
}

.publish {
    width: 100%;
    background: #168b58;
}

.approve { background: #168b58; }
.reject { background: #bd3545; }

.confession {
    background: #0b1220;
    border: 1px solid #263449;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.date {
    color: #71829a;
    font-size: 12px;
    margin-top: 10px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.actions button { flex: 1; }

#status, #loginStatus, #announcementStatus,
#moderatorStatus, #moderatorCount {
    margin-top: 12px;
    font-size: 14px;
}

#moderatorCount {
    color: #65b5ff;
    font-weight: bold;
    font-size: 17px;
}

.hidden { display: none; }

footer {
    text-align: center;
    color: #637086;
    font-size: 12px;
    padding: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>LYNX NETWORK</h1>
    <p>Panel administrativo de confesiones</p>
</header>

<section class="panel" id="loginPanel">
    <h2>Acceso administrativo</h2>

    <input
        type="password"
        id="adminKey"
        placeholder="Introduce tu Admin Key"
        autocomplete="current-password"
    >

    <button class="primary" id="loginButton">
        Iniciar sesión
    </button>

    <div id="loginStatus" role="status"></div>
</section>

<div id="dashboard" class="hidden">

    <section class="panel">
        <h2>📢 Publicar aviso</h2>

        <textarea
            id="announcementMessage"
            maxlength="500"
            placeholder="Escribe el comunicado de LYNX..."
        ></textarea>

        <p style="color:#8995a8;font-size:12px;">
            El aviso aparecerá en la página principal
            y se mostrará durante 6 segundos.
        </p>

        <button class="publish" id="publishButton">
            PUBLICAR AVISO
        </button>

        <div id="announcementStatus" role="status"></div>
    </section>

    <section class="panel">
        <h2>Confesiones pendientes</h2>

        <button class="primary" id="refreshButton">
            Actualizar lista
        </button>

        <div id="status" role="status"></div>
        <div id="pending"></div>
    </section>

    <section class="panel">
        <h2>🛡️ SOLICITUDES DE MODERADOR</h2>

        <div id="moderatorCount">Moderadores: --/3</div>

        <button class="primary" id="refreshModeratorsButton">
            Actualizar solicitudes
        </button>

        <div id="moderatorStatus" role="status"></div>
        <div id="moderatorRequests"></div>
    </section>

    <section class="panel">
        <button id="logoutButton"
            style="width:100%;background:#34445e;">
            Cerrar sesión
        </button>
    </section>

</div>

<footer>
    LYNX NETWORK © 2026<br>
    Sistema de moderación
</footer>

</div>

<script>
const API = "https://confesiones.lynxnetwork.workers.dev";

let adminKey = "";

const $ = id => document.getElementById(id);

$("loginButton").addEventListener("click", login);
$("refreshButton").addEventListener("click", loadPending);
$("refreshModeratorsButton").addEventListener("click", loadModeratorRequests);
$("logoutButton").addEventListener("click", logout);
$("publishButton").addEventListener("click", publishAnnouncement);

$("adminKey").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
});

function adminHeaders(extra = {}) {
    return {
        ...extra,
        "Authorization": "Bearer " + adminKey
    };
}

// ACCESO ADMINISTRATIVO
async function login() {
    const key = $("adminKey").value.trim();

    if (!key) {
        $("loginStatus").textContent = "Introduce tu Admin Key.";
        return;
    }

    $("loginButton").disabled = true;
    $("loginStatus").textContent = "Verificando acceso...";

    try {
        const response = await fetch(API + "/api/admin/confessions", {
            headers: {
                "Authorization": "Bearer " + key
            }
        });

        if (response.status === 401) {
            $("loginStatus").textContent = "Admin Key incorrecta.";
            return;
        }

        if (!response.ok) throw new Error();

        adminKey = key;
        $("adminKey").value = "";

        $("loginPanel").classList.add("hidden");
        $("dashboard").classList.remove("hidden");

        await renderPending(await response.json());

        await Promise.all([
            loadModeratorRequests(),
            loadModeratorCount()
        ]);

    } catch {
        $("loginStatus").textContent =
            "Error de conexión con el servidor.";
    } finally {
        $("loginButton").disabled = false;
    }
}

// PUBLICAR AVISOS
async function publishAnnouncement() {
    const message = $("announcementMessage").value.trim();
    const button = $("publishButton");
    const status = $("announcementStatus");

    if (!message || message.length > 500) {
        status.textContent = "Escribe un aviso de hasta 500 caracteres.";
        return;
    }

    if (!confirm("¿Publicar este aviso en LYNX Confesiones?")) {
        return;
    }

    button.disabled = true;
    status.textContent = "Publicando aviso...";

    try {
        const response = await fetch(
            API + "/api/admin/announcements",
            {
                method: "POST",
                headers: adminHeaders({
                    "Content-Type": "application/json"
                }),
                body: JSON.stringify({ message })
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) throw new Error();

        $("announcementMessage").value = "";
        status.textContent = "¡Aviso publicado correctamente!";

    } catch {
        status.textContent =
            "No se pudo publicar el aviso. Intenta nuevamente.";
    } finally {
        button.disabled = false;
    }
}

// CARGAR CONFESIONES
async function loadPending() {
    $("status").textContent = "Cargando confesiones...";

    try {
        const response = await fetch(
            API + "/api/admin/confessions",
            {
                headers: adminHeaders()
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) throw new Error();

        await renderPending(await response.json());
        $("status").textContent = "";

    } catch {
        $("status").textContent =
            "No se pudo cargar la lista.";
    }
}

// MOSTRAR CONFESIONES
async function renderPending(data) {
    const container = $("pending");
    container.replaceChildren();

    const pendingItems = Array.isArray(data)
        ? data.filter(item => item.status === "pendiente")
        : [];

    if (pendingItems.length === 0) {
        container.textContent = "No hay confesiones pendientes.";
        return;
    }

    pendingItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "confession";

        const message = document.createElement("div");
        message.textContent = item.message;

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = item.created_at || "";

        const actions = document.createElement("div");
        actions.className = "actions";

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "Aprobar";
        approve.onclick = () =>
            moderate(item.id, "aprobada", card);

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Rechazar";
        reject.onclick = () =>
            moderate(item.id, "rechazada", card);

        actions.append(approve, reject);
        card.append(message, date, actions);
        container.appendChild(card);
    });
}

// MODERAR CONFESIONES
async function moderate(id, decision, card) {
    if (decision === "rechazada" &&
        !confirm("¿Seguro que quieres rechazar esta confesión?")) {
        return;
    }

    const buttons = card.querySelectorAll("button");
    buttons.forEach(button => button.disabled = true);

    $("status").textContent = "Guardando decisión...";

    try {
        const response = await fetch(
            API + "/api/admin/confessions/" + id,
            {
                method: "PATCH",
                headers: adminHeaders({
                    "Content-Type": "application/json"
                }),
                body: JSON.stringify({ status: decision })
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) throw new Error();

        $("status").textContent = "Decisión guardada.";
        await loadPending();

    } catch {
        $("status").textContent =
            "Error al guardar. Intenta nuevamente.";
        buttons.forEach(button => button.disabled = false);
    }
}

// CONTAR MODERADORES
async function loadModeratorCount() {
    try {
        const response = await fetch(API + "/api/moderators/count");

        if (!response.ok) throw new Error();

        const data = await response.json();

        $("moderatorCount").textContent =
            "Moderadores: " + data.count + "/" + data.max;

    } catch {
        $("moderatorCount").textContent =
            "No se pudo consultar el contador.";
    }
}

// CARGAR SOLICITUDES
async function loadModeratorRequests() {
    $("moderatorStatus").textContent =
        "Cargando solicitudes...";

    try {
        const response = await fetch(
            API + "/api/admin/moderator-requests",
            {
                headers: adminHeaders()
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) throw new Error();

        const data = await response.json();
        renderModeratorRequests(data);

        $("moderatorStatus").textContent = "";

        await loadModeratorCount();

    } catch {
        $("moderatorStatus").textContent =
            "No se pudieron cargar las solicitudes.";
    }
}

// MOSTRAR SOLICITUDES
function renderModeratorRequests(data) {
    const container = $("moderatorRequests");
    container.replaceChildren();

    const pendingItems = Array.isArray(data)
        ? data.filter(item => item.status === "pendiente")
        : [];

    if (pendingItems.length === 0) {
        container.textContent =
            "No hay solicitudes de moderador pendientes.";
        return;
    }

    pendingItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "confession";

        const alias = document.createElement("strong");
        alias.textContent = "Alias: " + item.alias;

        const message = document.createElement("div");
        message.style.marginTop = "12px";
        message.textContent = item.message;

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = item.created_at || "";

        const actions = document.createElement("div");
        actions.className = "actions";

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "Aprobar";
        approve.onclick = () =>
            moderateModerator(item.id, "aprobada", card);

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Rechazar";
        reject.onclick = () =>
            moderateModerator(item.id, "rechazada", card);

        actions.append(approve, reject);
        card.append(alias, message, date, actions);
        container.appendChild(card);
    });
}

// APROBAR O RECHAZAR MODERADORES
async function moderateModerator(id, decision, card) {
    const question = decision === "aprobada"
        ? "¿Aprobar esta solicitud? Recuerda que el máximo es de 3 moderadores."
        : "¿Seguro que quieres rechazar esta solicitud?";

    if (!confirm(question)) return;

    const buttons = card.querySelectorAll("button");
    buttons.forEach(button => button.disabled = true);

    $("moderatorStatus").textContent =
        "Guardando decisión...";

    try {
        const response = await fetch(
            API + "/api/admin/moderator-requests/" + id,
            {
                method: "PATCH",
                headers: adminHeaders({
                    "Content-Type": "application/json"
                }),
                body: JSON.stringify({ status: decision })
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "No se pudo guardar la decisión.");
        }

        $("moderatorStatus").textContent =
            decision === "aprobada"
                ? "¡Solicitud aprobada!"
                : "Solicitud rechazada.";

        await loadModeratorRequests();

    } catch (error) {
        $("moderatorStatus").textContent =
            error.message || "Error al guardar la decisión.";

        buttons.forEach(button => button.disabled = false);
    }
}

// CERRAR SESIÓN
function logout() {
    adminKey = "";

    $("dashboard").classList.add("hidden");
    $("loginPanel").classList.remove("hidden");

    $("adminKey").value = "";
    $("loginStatus").textContent = "";
    $("announcementMessage").value = "";
    $("announcementStatus").textContent = "";
    $("pending").replaceChildren();
    $("status").textContent = "";
    $("moderatorRequests").replaceChildren();
    $("moderatorStatus").textContent = "";
    $("moderatorCount").textContent = "Moderadores: --/3";
}
</script>

</body>
</html>
