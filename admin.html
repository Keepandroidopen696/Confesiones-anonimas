
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYNX | Panel Administrativo</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #080b12;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 800px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 { color: #55aaff; }

.panel {
    background: #111827;
    border: 1px solid #263449;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 { color: #65b5ff; }

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #34445e;
    background: #080d17;
    color: white;
    margin: 10px 0;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.primary {
    width: 100%;
    background: #1685e8;
}

.approve { background: #168b58; }
.reject { background: #bd3545; }

.confession {
    background: #0b1220;
    border: 1px solid #263449;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.date {
    color: #71829a;
    font-size: 12px;
    margin-top: 10px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.actions button { flex: 1; }

#status, #loginStatus {
    margin-top: 12px;
    font-size: 14px;
}

.hidden { display: none; }

footer {
    text-align: center;
    color: #637086;
    font-size: 12px;
    padding: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>LYNX NETWORK</h1>
    <p>Panel administrativo de confesiones</p>
</header>

<section class="panel" id="loginPanel">
    <h2>Acceso administrativo</h2>

    <input
        type="password"
        id="adminKey"
        placeholder="Introduce tu Admin Key"
        autocomplete="current-password"
    >

    <button class="primary" id="loginButton">
        Iniciar sesión
    </button>

    <div id="loginStatus" role="status"></div>
</section>

<section class="panel hidden" id="dashboard">
    <h2>Confesiones pendientes</h2>

    <button class="primary" id="refreshButton">
        Actualizar lista
    </button>

    <button id="logoutButton"
        style="width:100%; margin-top:10px; background:#34445e;">
        Cerrar sesión
    </button>

    <div id="status" role="status"></div>
    <div id="pending"></div>
</section>

<footer>
    LYNX NETWORK © 2026<br>
    Sistema de moderación
</footer>

</div>

<script>
const API = "https://confesiones.lynxnetwork.workers.dev";

let adminKey = "";

const $ = id => document.getElementById(id);

$("loginButton").addEventListener("click", login);
$("refreshButton").addEventListener("click", loadPending);
$("logoutButton").addEventListener("click", logout);

$("adminKey").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
});

async function login() {
    const key = $("adminKey").value;
    const status = $("loginStatus");

    if (!key) {
        status.textContent = "Introduce tu Admin Key.";
        return;
    }

    $("loginButton").disabled = true;
    status.textContent = "Verificando acceso...";

    try {
        const response = await fetch(API + "/api/admin/confessions", {
            headers: {
                "Authorization": "Bearer " + key
            }
        });

        if (response.status === 401) {
            status.textContent = "Admin Key incorrecta.";
            return;
        }

        if (!response.ok) throw new Error();

        adminKey = key;
        $("adminKey").value = "";

        $("loginPanel").classList.add("hidden");
        $("dashboard").classList.remove("hidden");

        await renderPending(await response.json());

    } catch {
        status.textContent = "Error de conexión con el servidor.";
    } finally {
        $("loginButton").disabled = false;
    }
}

async function loadPending() {
    $("status").textContent = "Cargando confesiones...";

    try {
        const response = await fetch(API + "/api/admin/confessions", {
            headers: {
                "Authorization": "Bearer " + adminKey
            }
        });

        if (response.status === 401) {
            logout();
            $("loginStatus").textContent = "Sesión no autorizada.";
            return;
        }

        if (!response.ok) throw new Error();

        await renderPending(await response.json());
        $("status").textContent = "";

    } catch {
        $("status").textContent = "No se pudo cargar la lista.";
    }
}

async function renderPending(data) {
    const container = $("pending");
    container.replaceChildren();

    if (!Array.isArray(data) || data.length === 0) {
        container.textContent = "No hay confesiones pendientes.";
        return;
    }

    data.forEach(item => {
        const card = document.createElement("div");
        card.className = "confession";

        const message = document.createElement("div");
        message.textContent = item.message;

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = item.created_at || "";

        const actions = document.createElement("div");
        actions.className = "actions";

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "Aprobar";
        approve.addEventListener("click", () =>
            moderate(item.id, "aprobada", card)
        );

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Rechazar";
        reject.addEventListener("click", () =>
            moderate(item.id, "rechazada", card)
        );

        actions.append(approve, reject);
        card.append(message, date, actions);
        container.appendChild(card);
    });
}

async function moderate(id, decision, card) {
    if (decision === "rechazada" &&
        !confirm("¿Seguro que quieres rechazar esta confesión?")) {
        return;
    }

    const buttons = card.querySelectorAll("button");
    buttons.forEach(button => button.disabled = true);

    $("status").textContent = "Guardando decisión...";

    try {
        const response = await fetch(
            API + "/api/admin/confessions/" + id,
            {
                method: "PATCH",
                headers: {
                    "Authorization": "Bearer " + adminKey,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status: decision })
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok) throw new Error();

        $("status").textContent = "Decisión guardada.";
        await loadPending();

    } catch {
        $("status").textContent = "Error al guardar. Intenta nuevamente.";
        buttons.forEach(button => button.disabled = false);
    }
}

function logout() {
    adminKey = "";

    $("dashboard").classList.add("hidden");
    $("loginPanel").classList.remove("hidden");
    $("adminKey").value = "";
    $("loginStatus").textContent = "";
    $("pending").replaceChildren();
    $("status").textContent = "";
}
</script>
</body>
</html>
