
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYNX ADMIN | Confesiones</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #080b12;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 750px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #36a5ff;
    letter-spacing: 2px;
}

.subtitle {
    text-align: center;
    color: #8291a8;
    margin-bottom: 30px;
}

.panel {
    background: #101827;
    border: 1px solid #24344a;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #31445d;
    background: #080b12;
    color: white;
    margin: 10px 0;
    outline: none;
}

button {
    padding: 11px 16px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px 4px 5px 0;
}

.login-btn {
    width: 100%;
    background: #1689e8;
    color: white;
}

.approve {
    background: #147d50;
    color: white;
}

.reject {
    background: #a83242;
    color: white;
}

.refresh {
    background: #243b55;
    color: white;
}

.logout {
    background: #39465a;
    color: white;
}

.confession {
    background: #111a29;
    border: 1px solid #26384f;
    border-radius: 10px;
    padding: 16px;
    margin: 14px 0;
    overflow-wrap: anywhere;
}

.date {
    color: #8493a8;
    font-size: 12px;
    margin-top: 12px;
}

#message {
    text-align: center;
    color: #36a5ff;
    margin: 15px 0;
}

.hidden {
    display: none;
}
</style>
</head>

<body>
<div class="container">

<h1>LYNX ADMIN</h1>
<p class="subtitle">Sistema de moderación | Confesiones anónimas</p>

<div id="loginPanel" class="panel">
    <h2>Acceso administrativo</h2>
    <input
        type="password"
        id="password"
        placeholder="Contraseña de administrador"
        autocomplete="current-password"
    >
    <button class="login-btn" onclick="login()">
        INICIAR SESIÓN
    </button>
</div>

<div id="adminPanel" class="hidden">
    <div class="panel">
        <h2>Panel de control</h2>
        <button class="refresh" onclick="loadConfessions()">
            ACTUALIZAR
        </button>
        <button class="logout" onclick="logout()">
            CERRAR SESIÓN
        </button>
    </div>

    <div id="confessions"></div>
</div>

<div id="message"></div>

</div>

<script>
const API = "https://lynx-confesione-api.lynxnetwork.workers.dev";

let adminPassword = "";

function showMessage(text) {
    document.getElementById("message").textContent = text;
}

async function login() {
    const password = document.getElementById("password").value;

    if (!password) {
        showMessage("Introduce tu contraseña.");
        return;
    }

    adminPassword = password;
    showMessage("Verificando acceso...");

    try {
        const response = await fetch(API + "/api/admin/confessions", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${adminPassword}`
            }
        });

        if (response.status === 401) {
            adminPassword = "";
            showMessage("Contraseña incorrecta.");
            return;
        }

        if (!response.ok) {
            adminPassword = "";
            showMessage("Error del servidor: " + response.status);
            return;
        }

        document.getElementById("loginPanel").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");

        showMessage("Acceso autorizado.");
        displayConfessions(await response.json());

    } catch (error) {
        adminPassword = "";
        showMessage("No se pudo conectar con el servidor.");
    }
}

async function loadConfessions() {
    showMessage("Cargando confesiones...");

    try {
        const response = await fetch(API + "/api/admin/confessions", {
            headers: {
                "Authorization": `Bearer ${adminPassword}`
            }
        });

        if (response.status === 401) {
            logout();
            showMessage("Sesión no autorizada. Inicia sesión nuevamente.");
            return;
        }

        if (!response.ok) {
            showMessage("Error al cargar confesiones.");
            return;
        }

        displayConfessions(await response.json());
        showMessage("Lista actualizada.");

    } catch (error) {
        showMessage("Error de conexión.");
    }
}

function displayConfessions(data) {
    const container = document.getElementById("confessions");
    container.replaceChildren();

    if (!data.length) {
        container.textContent = "No hay confesiones pendientes.";
        return;
    }

    data.forEach(confession => {
        const card = document.createElement("div");
        card.className = "confession";

        const title = document.createElement("h3");
        title.textContent = "Confesión #" + confession.id;

        const content = document.createElement("p");
        content.textContent = confession.message;

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = confession.created_at || "";

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "APROBAR";
        approve.onclick = () => moderate(confession.id, "aprobada");

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "RECHAZAR";
        reject.onclick = () => moderate(confession.id, "rechazada");

        card.append(title, content, date, approve, reject);
        container.appendChild(card);
    });
}

async function moderate(id, status) {
    const action = status === "aprobada" ? "aprobar" : "rechazar";

    if (!confirm("¿Seguro que quieres " + action + " esta confesión?")) {
        return;
    }

    try {
        const response = await fetch(
            API + "/api/admin/confessions/" + id,
            {
                method: "PATCH",
                headers: {
                    "Authorization": `Bearer ${adminPassword}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status })
            }
        );

        if (response.status === 401) {
            logout();
            showMessage("Sesión no autorizada.");
            return;
        }

        if (!response.ok) {
            showMessage("No se pudo actualizar la confesión.");
            return;
        }

        showMessage("Confesión " + status + ".");
        loadConfessions();

    } catch (error) {
        showMessage("Error de conexión.");
    }
}

function logout() {
    adminPassword = "";

    document.getElementById("password").value = "";
    document.getElementById("loginPanel").classList.remove("hidden");
    document.getElementById("adminPanel").classList.add("hidden");

    document.getElementById("confessions").replaceChildren();
    showMessage("Sesión cerrada.");
}
</script>

</body>
</html>
